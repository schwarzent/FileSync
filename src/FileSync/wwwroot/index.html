<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="filesync-session" content="__SESSION_TOKEN__">
  <meta name="color-scheme" content="light">
  <title>FileSync · 文件同步</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#sync"><img src="/favicon.svg" alt=""><span>FileSync<small>让文件，保持同步。</small></span></a>
    <div class="nav-label">工作空间</div>
    <nav aria-label="主导航" id="navigation"></nav>
    <div class="sidebar-bottom"><span class="status-dot"></span>局域网直连<span class="version">v0.1</span></div>
  </aside>
  <main>
    <header class="topbar"><span class="breadcrumb">工作空间 <span>/</span> <b id="page-name">同步任务</b></span><span class="local-badge"><span class="status-dot"></span>本机管理</span></header>
    <div id="content" class="content" aria-live="polite"><p class="loading">正在连接本机服务…</p></div>
    <div id="progress" class="progress-panel" hidden aria-live="polite"></div>
    <footer>FileSync <span>文件由你掌控，同步由你决定。</span><span class="footer-right">Windows · 局域网同步</span></footer>
  </main>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
